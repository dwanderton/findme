[project]
name = "findme"
version = "0.1.0"
description = "findMe backend: face search on Runpod serverless with photo enrichment"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy",
    "onnxruntime",
    "pillow",
    "piexif",
    "pyarrow",
    "httpx",
    "fastapi",
    "python-multipart",
    "runpod-flash",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "respx",
    "openapi-spec-validator",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/findme"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
markers = ["golden: CPU golden pipeline tests", "integration: full-path fixture tests"]
